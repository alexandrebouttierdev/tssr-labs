[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/alexandrebouttierdev/tssr-labs"
publish = false

[workspace.dependencies]
# Crates internes
tssrlabs-domain = { path = "crates/tssrlabs-domain" }
tssrlabs-infrastructure = { path = "crates/tssrlabs-infrastructure" }
tssrlabs-tui = { path = "crates/tssrlabs-tui" }

# Interface terminal
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Localisation
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
unicode-width = "0.2"

# Asynchronisme
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Erreurs, logs, chemins
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = "0.2"
directories = "6"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

# Tests
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
